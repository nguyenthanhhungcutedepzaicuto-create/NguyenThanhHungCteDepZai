<html lang="vi">
  <head>

    <title>
      NGUYỄN TRUNG IOS — MOD MENU

    <style>
      :root{color-scheme:dark;--bg:#080b14;--panel:#101827;--line:#26334b;--muted:#91a2bd;--text:#edf5ff;--accent:#37e6ff;--green:#a3ff65}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% -10%,#12334b 0,transparent 38%),radial-gradient(ellipse at 95% 15%,#241544 0,transparent 30%),var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,BlinkMacSystemFont,&#34;Segoe UI&#34;,sans-serif;background-attachment:fixed}
    button,select,a{-webkit-tap-highlight-color:transparent}button,select{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer}button:disabled{cursor:wait;opacity:.5}
    button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:4px}button{color:inherit}a{color:inherit;text-decoration:none}
    .shell{width:min(1240px,calc(100% - 64px));margin:auto}.topbar{height:86px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #26334b;background:#080b14d9;backdrop-filter:blur(18px);position:relative}.topbar:after{content:&#34;&#34;;position:absolute;bottom:-1px;left:0;width:100%;height:1px;background:linear-gradient(90deg,transparent,#37e6ff,#a855f7,transparent)}
    .brand{display:flex;align-items:center;gap:12px;font-size:13px;font-weight:800;letter-spacing:2px}.brandmark{display:grid;place-items:center;background:linear-gradient(135deg,#37e6ff,#a855f7);color:#07111c;width:38px;height:38px;border-radius:12px;font-size:21px;letter-spacing:0;box-shadow:0 0 24px #37e6ff45}
    .platform{color:var(--muted);font-size:12px;display:flex;gap:8px;align-items:center}.dot{height:6px;width:6px;background:var(--green);border-radius:50%}
    .intro{padding:42px 0 28px;display:flex;align-items:flex-end;justify-content:space-between;gap:20px}.eyebrow{color:var(--accent);text-transform:uppercase;letter-spacing:2px;font-size:11px;font-weight:700;margin:0 0 8px}
    h1{font-size:clamp(30px,4vw,42px);letter-spacing:-1.3px;line-height:1.12;margin:0 0 9px;background:linear-gradient(90deg,#f4fbff 10%,#37e6ff 55%,#b78aff);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 32px #37e6ff15}.sub{color:var(--muted);margin:0;font-size:13px}.count{color:var(--muted);font-size:12px;padding-bottom:2px}
    .workspace{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(350px,1fr);gap:22px;align-items:start}.stage{border:1px solid #2c4563;border-radius:20px;overflow:hidden;background:#0e1625;position:sticky;top:20px;box-shadow:0 18px 65px #0006,0 0 35px #37e6ff0a}
    .stage-head{position:absolute;z-index:2;top:22px;left:24px;right:24px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}.character-name{font-size:20px;font-weight:800;letter-spacing:3px}.badge{font-size:10px;letter-spacing:1px;color:var(--muted);border:1px solid #494950;border-radius:20px;padding:4px 10px}
    #viewport{height:550px;position:relative;background:radial-gradient(ellipse at 50% 45%,#343041 0,#201e29 38%,#17171f 75%)}#viewport canvas{width:100%;height:100%;display:block;touch-action:none}
    .watermark{position:absolute;top:15%;left:50%;transform:translateX(-50%);font-size:100px;font-weight:900;letter-spacing:14px;color:#ffffff05;pointer-events:none;white-space:nowrap}
    #fallback{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:none}.preview-message{position:absolute;inset:0;display:grid;place-content:center;padding:35px;text-align:center;color:var(--muted);font-size:13px;pointer-events:none}.preview-message.hidden{display:none}
    .stage-footer{padding:15px 22px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}.hint{margin:0;color:var(--muted);font-size:11px;max-width:270px}.
      view-tools{display:flex;gap:7px;flex-shrink:0}.small-button{background:#17243a;border:1px solid #304663;border-radius:8px;min-width:36px;padding:7px 10px;font-size:12px;white-space:nowrap}
    .panel{border:1px solid #2c4563;border-radius:20px;padding:24px;background:linear-gradient(145deg,#111c2d,#0d1320);box-shadow:0 18px 65px #0005}.panel-title{margin:0 0 16px;font-size:16px;letter-spacing:-.3px}.presets{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:26px}
    .preset{border:1px solid #41404b;background:#141f32;border-radius:12px;text-align:left;padding:12px 14px;transition:background .18s,border-color .18s}.preset:hover{background:#302b3c}.preset[aria-pressed=&#34;true&#34;]{border-color:var(--accent);background:#b29aff14}.preset-num{color:var(--muted);font-size:10px;letter-spacing:1.6px;margin-bottom:5px;display:block}.preset-name{font-size:13px;font-weight:650;display:block}.preset-detail{font-size:10px;color:var(--muted);display:block;margin-top:3px}
    .form-row{display:grid;grid-template-columns:91px 1fr;align-items:center;gap:12px;margin:11px 0}.form-row label,.fixed-label{font-size:12px;color:var(--muted)}.row-icon{display:inline-block;width:22px;color:#d2c5f0;font-size:14px}.select-wrap{position:relative}.select-wrap::after{content:&#39;⌄&#39;;position:absolute;right:15px;top:8px;pointer-events:none;color:var(--accent)}
    select{width:100%;appearance:none;background:#272631;border:1px solid #44424e;border-radius:10px;padding:10px 36px 10px 13px;color:var(--text);font-size:13px;cursor:pointer;min-height:42px}.fixed-value{background:#202029;border:1px solid #2e2d39;border-radius:10px;padding:10px 13px;font-size:13px;min-height:42px;display:flex;justify-content:space-between;align-items:center}.fixed-value .single{font-size:10px;color:#777684}
    .form-divider{height:1px;background:var(--line);margin:20px 0}.action-note{margin:7px 0 0 103px;font-size:11px;line-height:1.6;color:var(--muted)}.mix-tools{display:flex;gap:8px;margin-top:20px}.mix-tools button{border:1px solid #41404b;border-radius:9px;background:transparent;padding:8px 12px;font-size:12px;flex:1}.mix-tools button:hover{background:#2b2935}
    .download-area{margin-top:21px;border-top:1px solid var(--line);padding-top:20px}.selection-caption{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:1.3px;margin:0 0 6px}.selection-summary{font-size:12px;color:#d1c7e4;margin:0 0 16px;min-height:36px;line-height:1.7}.download{display:flex;width:100%;gap:10px;justify-content:center;align-items:center;background:linear-gradient(100deg,#a3ff65,#37e6ff);color:#06131c;box-shadow:0 8px 25px #37e6ff20;border:0;border-radius:11px;padding:13px 14px;font-weight:750;font-size:13px}.download:hover{background:#d5faa1}.download:disabled{background:#434b36;color:#a2aa96}.download svg{width:17px;height:17px}.status{font-size:11px;text-align:center;color:var(--muted);margin:10px 0 0;min-height:17px}.status.error{color:#ffaaaa}
    footer{color:#91a2bd;padding:28px 0 30px;font-size:10px;display:flex;justify-content:space-between;gap:15px}footer a{text-decoration:underline}.noscript{padding:20px;color:#ffaaaa}
    .buy-key-top,.hero-buy{display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;border-radius:11px;font-weight:900;letter-spacing:.5px;background:linear-gradient(100deg,#37e6ff,#a855f7);color:#07111c;padding:11px 15px;font-size:11px;box-shadow:0 7px 25px #37e6ff20;white-space:nowrap}.hero-buy{padding:13px 17px}.hero-buy span{font-size:17px}.buy-key-top:hover,.hero-buy:hover{filter:brightness(1.12);transform:translateY(-1px)}.fish-menu{background:#101827;border-color:#2c4563}.fish-menu a:hover{background:#172a40}@media(max-width:860px){.hero-buy{align-self:flex-start}.intro{align-items:flex-start;flex-direction:column}.shell{width:calc(100% - 36px)}.workspace{grid-template-columns:1fr}.stage{position:relative;top:0}#viewport{height:470px}.intro{padding:26px 0 22px}.topbar{height:72px}.panel{padding:22px}.hint{max-width:240px}h1{font-size:29px}}
